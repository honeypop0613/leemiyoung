  <style>
    /* Portfolio detail viewer: content only */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background: #ffffff !important;
    }

    body.index-page {
      padding-top: 0 !important;
    }

    #header,
    header,
    .page-title,
    #footer,
    footer,
    #scroll-top,
    #preloader {
      display: none !important;
    }

    main.main {
      margin: 0 !important;
      padding: 0 !important;
    }

    #portfolio-details.portfolio-details.section,
    .portfolio-details.section {
      margin: 0 !important;
      padding: 0 !important;
      background: #ffffff !important;
    }

    #portfolio-details > .container,
    .portfolio-details > .container,
    #portfolio-details .container {
      width: 100% !important;
      max-width: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    #portfolio-details .row {
      margin: 0 !important;
      --bs-gutter-x: 0 !important;
      --bs-gutter-y: 0 !important;
    }

    #portfolio-details [class*="col-"],
    #portfolio-details .col-lg-12,
    #portfolio-details .mx-auto {
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .portfolio-scroll {
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .portfolio-scroll img {
      width: 100% !important;
      height: auto !important;
      display: block !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .portfolio-details-slider,
    .portfolio-details-slider .swiper-wrapper,
    .portfolio-details-slider .swiper-slide,
    .portfolio-details-slider .ratio {
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .portfolio-details video,
    .portfolio-details iframe {
      width: 100% !important;
      display: block !important;
      border: 0 !important;
    }

    .portfolio-details .swiper-pagination {
      margin-bottom: 0 !important;
    }
  
    /* Detail pages must remain visible without AOS initialization */
    [data-aos] {
      opacity: 1 !important;
      transform: none !important;
      transition: none !important;
    }

  
    /* ===== 80% centered portfolio + close button ===== */
    .portfolio-scroll,
    .portfolio-details-slider {
      width: 50% !important;
      max-width: 50% !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }

    .portfolio-scroll img {
      width: 100% !important;
      height: auto !important;
      display: block !important;
      margin: 0 auto !important;
    }

    .portfolio-details-slider video,
    .portfolio-details-slider iframe {
      width: 100% !important;
      display: block !important;
    }

    .detail-close-button {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 99999;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: rgba(45, 45, 45, 0.90);
      color: #ffffff;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .detail-close-button:hover {
      background: #1f1f1f;
      transform: scale(1.06);
    }

    @media (max-width: 767.98px) {
      .portfolio-scroll,
      .portfolio-details-slider {
        width: 94% !important;
        max-width: 94% !important;
      }

      .detail-close-button {
        right: 14px;
        bottom: 14px;
        width: 46px;
        height: 46px;
        font-size: 21px;
      }
    }

  
    .detail-close-button { display: none !important; }
  </style>
