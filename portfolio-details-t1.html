<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기획 | 이미영 포트폴리오</title>
  <link href="assets/img/favicon.png" rel="icon">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
    }
    .project-scroll {
      width: 70%;
      max-width: 1600px;
      margin: 0 auto;
    }
    .project-scroll img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
    }
    @media (max-width: 767.98px) {
      .project-scroll {
        width: 94%;
      }
    }

    .pdf-viewer {
      width: 100%;
      height: 100vh;
      min-height: 900px;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    .pdf-viewer iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    @media (max-width: 767.98px) {
      .pdf-viewer {
        min-height: 75vh;
      }
    }

  </style>
</head>
<body>
  <main class="project-scroll">
    <img src="assets/img/portfolio/team/planning/02.png" alt="팀프로젝트 기획 메인 이미지">

    <div class="pdf-viewer">
      <iframe
        src="assets/img/portfolio/team/planning/아덴블랑제리 센텀 리브랜딩 마케팅 기획서.pdf#view=FitH"
        title="아덴블랑제리 센텀 리브랜딩 마케팅 기획서"
        loading="lazy">
      </iframe>
    </div>
  </main>
</body>
</html>
